name: Metrics

on:
  # Rebuild the metrics image every day
  schedule:
    - cron: "27 3 * * *"
  # ...and let me trigger it by hand
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@v3.34
        with:
          # Fine-grained or classic PAT stored as a repo secret.
          # Falls back to GITHUB_TOKEN for a basic (public-only) render.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JustMaris
          filename: github-metrics.svg
          template: classic
          config_timezone: Europe/Tallinn

          # --- base sections ---
          # Kept lean so it renders cleanly with the default GITHUB_TOKEN.
          # Once secrets.METRICS_TOKEN (a PAT) is set, the commented plugins
          # below can be turned on for languages / lines / private commits.
          base: header, activity, community
          base_indepth: yes

          # --- commit calendar (isometric) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- needs a PAT in secrets.METRICS_TOKEN to render cleanly ---
          # plugin_languages: yes
          # plugin_languages_details: bytes-size, percentage
          # plugin_languages_limit: 8
          # plugin_lines: yes
          # plugin_activity: yes
          # plugin_activity_limit: 5

          # commit the generated SVG back to this repo
          output_action: commit
          committer_message: "chore: refresh github-metrics.svg"
