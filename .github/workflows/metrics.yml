name: Metrics

on:
  # Rebuild the metrics images every day
  schedule:
    - cron: "27 3 * * *"
  # ...and let me trigger it by hand
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    # Steps run in order; each commits its own file, so the second is based on
    # the first's push.
    concurrency:
      group: metrics
      cancel-in-progress: false
    steps:
      # Two separate panels so the README can place them side by side.
      # A single metrics image with `config_display: columns` overlaps the
      # isometric calendar with neighbouring text, so it is not usable.

      - name: Activity panel
        uses: lowlighter/metrics@v4
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JustMaris
          filename: metrics-activity.svg
          template: classic
          config_timezone: Europe/Tallinn
          base: activity
          output_action: commit
          committer_message: "chore: refresh metrics-activity.svg"

      - name: Calendar panel
        uses: lowlighter/metrics@v4
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JustMaris
          filename: metrics-calendar.svg
          template: classic
          config_timezone: Europe/Tallinn
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: commit
          committer_message: "chore: refresh metrics-calendar.svg"
