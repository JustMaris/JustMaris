name: Metrics

on:
  # Rebuild the metrics images every day
  schedule:
    - cron: "27 3 * * *"
  # ...and let me trigger it by hand
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Two separate panels so the README can place them side by side.
      # A single metrics image with `config_display: columns` overlaps the
      # isometric calendar with neighbouring text, so it is not usable.

      - name: Activity panel
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JustMaris
          filename: metrics-activity.svg
          template: classic
          config_timezone: Europe/Tallinn
          base: activity
          output_action: none

      - name: Calendar panel
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JustMaris
          filename: metrics-calendar.svg
          template: classic
          config_timezone: Europe/Tallinn
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: none

      - name: Commit panels if changed
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain metrics-activity.svg metrics-calendar.svg)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add metrics-activity.svg metrics-calendar.svg
            git commit -m "chore: refresh metrics panels"
            git push
          else
            echo "No change."
          fi
