name: Metrics

on:
  # Rebuild the metrics image every day
  schedule:
    - cron: "27 3 * * *"
  # ...and let me trigger it by hand
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@v3.34
        with:
          # Fine-grained or classic PAT stored as a repo secret.
          # Falls back to GITHUB_TOKEN for a basic (public-only) render.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: JustMaris
          filename: github-metrics.svg
          template: classic
          config_timezone: Europe/Tallinn

          # Two columns: activity breakdown on the left, commit calendar on the
          # right. No 'header'/'community'/'repositories' — that was the noise.
          config_display: columns
          config_order: base.activity, isocalendar
          base: activity
          base_indepth: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # commit the generated SVG back to this repo
          output_action: commit
          committer_message: "chore: refresh github-metrics.svg"
